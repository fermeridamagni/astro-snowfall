name: Auto Assign

on:
  issues:
    types: [ opened, reopened ]

  pull_request:
    types: [ opened, reopened ]

concurrency:
  group: auto-assign-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auto-assign:
    name: Auto Assign
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: "Auto-assign issue"
        uses: pozil/auto-assign-issue@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: fermeridamagni
          numOfAssignee: 1
